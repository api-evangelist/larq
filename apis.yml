aid: larq
name: LARQ
description: 'LARQ is a direct-to-consumer water technology company that designs self-cleaning
  and filtering drinkware and home water products. Its flagship Bottle PureVis uses UV-C
  light to neutralize up to 99.9999% of harmful, odor-causing bacteria in the bottle and
  on the water surface, and the range extends to filtered bottles, filtered pitchers, an
  under-sink water filter, and the cuva beverage flavor line. The company positions itself
  around sustainable hydration — reducing single-use plastic bottle consumption — and funds
  environmental nonprofits from a portion of each purchase. LARQ is a consumer hardware and
  e-commerce business: as of this enrichment pass it publishes no public API, developer
  portal, SDK, or machine-readable specification, and no /.well-known/ discovery documents.
  It was surfaced as a portfolio company of dcm-ventures. Sector: consumer.'
